# Overlay de desarrollo local.
# Se carga solo cuando se ejecuta `docker compose up` sin -f.
# Publica los puertos para poder usar la DB desde el IDE y la API desde el navegador.

services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
